{% extends "base.html" %}

{% block title %}Dashboard - Expense Tracker{% endblock %}

{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
{% endblock %}

{% block content %}
<h2 class="mb-4">Dashboard</h2>

<div class="row">
    <div class="col-lg-6 mb-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Weekly Summary (Last 7 Days)</h5>
                <canvas id="weeklyChart"></canvas>
            </div>
        </div>
    </div>
    <div class="col-lg-6 mb-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Monthly Summary (Last 6 Months)</h5>
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="text-center mt-2">
    <a href="{{ url_for('main.journal') }}" class="btn btn-primary">Add Journal Entry</a>
</div>
{% endblock %}

{% block scripts %}
<script>
    const weeklyData = {{ weekly_data | safe }};
    const monthlyData = {{ monthly_data | safe }};

    const chartColors = {
        expenses: { bg: 'rgba(255, 99, 132, 0.5)', border: 'rgb(255, 99, 132)' },
        income: { bg: 'rgba(144, 238, 144, 0.5)', border: 'rgb(144, 238, 144)' },
        withdrawals: { bg: 'rgba(255, 235, 59, 0.5)', border: 'rgb(255, 235, 59)' },
        netIncome: { bg: 'rgba(13, 110, 253, 0.15)', border: 'rgb(13, 110, 253)' },
    };

    function createChart(canvasId, data) {
        return new Chart(document.getElementById(canvasId), {
            type: 'bar',
            data: {
                labels: data.labels,
                datasets: [
                    {
                        label: 'Income',
                        data: data.income,
                        backgroundColor: chartColors.income.bg,
                        borderColor: chartColors.income.border,
                        borderWidth: 1,
                    },
                    {
                        label: 'Expenses',
                        data: data.expenses,
                        backgroundColor: chartColors.expenses.bg,
                        borderColor: chartColors.expenses.border,
                        borderWidth: 1,
                    },
                    {
                        label: 'Withdrawals',
                        data: data.withdrawals,
                        backgroundColor: chartColors.withdrawals.bg,
                        borderColor: chartColors.withdrawals.border,
                        borderWidth: 1,
                    },
                    {
                        label: 'Net Income',
                        data: data.net_income,
                        type: 'line',
                        backgroundColor: chartColors.netIncome.bg,
                        borderColor: chartColors.netIncome.border,
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: chartColors.netIncome.border,
                        fill: false,
                        tension: 0.3,
                        order: 0,
                    },
                ],
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) { return '\u20B9' + value; }
                        }
                    }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': \u20B9' + context.parsed.y.toFixed(2);
                            }
                        }
                    }
                }
            }
        });
    }

    createChart('weeklyChart', weeklyData);
    createChart('monthlyChart', monthlyData);
</script>
{% endblock %}
